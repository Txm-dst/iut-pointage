<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        if (sessionStorage.getItem('iutAuth') !== '1') { location.replace('index.html'); }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs — IUT Pointage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-switch-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #10b981;
            background: transparent;
            color: #10b981;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .role-btn.active {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand"><span class="brand-mark">IUT</span> IUT Pointage</div>
        <div class="nav-links">
            <a class="nav-link" href="edt.html">🕒 Emploi du temps</a>
            <a class="nav-link" href="recherche.html">🔍 Recherche</a>
            <a class="nav-link nav-green-active" href="gestion.html">👥 Gestion des utilisateurs</a>
        </div>
        <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
    </nav>

    <header class="page-hero page-hero-green">
        <div class="page-hero-inner">
            <span class="page-hero-icon">👥</span>
            <div>
                <h1>Gestion des utilisateurs</h1>
                <p>Ajoutez, consultez et administrez les étudiants et professeurs.</p>
            </div>
        </div>
    </header>

    <main class="content">

        <!-- BOUTONS DE BASCULE D'ONGLET (ÉTUDIANT / PROF) -->
        <div class="role-switch-container">
            <button id="btn-mode-eleve" class="role-btn active" onclick="setGestionMode('eleve')">👨‍🎓 Mode Étudiants</button>
            <button id="btn-mode-prof" class="role-btn" onclick="setGestionMode('prof')">👨‍🏫 Mode Professeurs</button>
        </div>

        <div class="card">
            <h3 id="form-title">Ajouter un étudiant</h3>
            <form id="add-student-form" onsubmit="addStudent(event)">
                <div class="form-row">
                    <input type="text" id="new-num-etu" placeholder="N° Identifiant / N° Étudiant" required>
                    <input type="text" id="new-nom" placeholder="Nom" required>
                    <input type="text" id="new-prenom" placeholder="Prénom" required>
                    
                    <!-- Champ Groupe (masqué dynamiquement si mode Prof) -->
                    <div id="groupe-input-container">
                        <input type="text" id="new-groupe" placeholder="Groupe / Affectation (ex: BUT3-TD2-PA)">
                    </div>

                    <!-- Champ ID Boîtier (affiché dynamiquement si mode Prof) -->
                    <div id="boitier-input-container" style="display: none;">
                        <input type="number" id="new-id-boitier" min="1" placeholder="ID Boîtier Raspberry Pi (ex: 1)">
                    </div>
                </div>

                <div class="form-row scan-row">
                    <input type="text" id="new-id-nfc" placeholder="id_nfc (UID carte)" required>
                    <button type="button" class="btn btn-secondary" onclick="simulateNFCScan()">Scanner carte NFC</button>
                </div>
                <button type="submit" id="btn-submit-user" class="btn btn-success">Enregistrer l'étudiant</button>
            </form>
        </div>

        <div class="card">
            <h3 id="table-title">Liste des étudiants</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>N° Identifiant</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Rôle</th>
                        <th id="th-groupe">Groupe</th>
                        <th id="th-boitier" style="display: none;">ID Boîtier</th>
                        <th>ID NFC</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-management-table"></tbody>
            </table>
        </div>
    </main>

    <!-- CDN Socket.IO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
