<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // On vérifie la connexion avant même d'afficher la page, pour éviter un flash de contenu
        if (sessionStorage.getItem('iutAuth') !== '1') { location.replace('index.html'); }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emploi du temps — IUT Pointage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Librairie pour parser le format iCal/ICS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="brand"><span class="brand-mark">IUT</span> IUT Pointage</div>
        <div class="nav-links">
            <a class="nav-link nav-blue-active" href="edt.html">🕒 Emploi du temps</a>
            <a class="nav-link" href="recherche.html">🔍 Recherche</a>
            <a class="nav-link" href="gestion.html">👥 Gestion des étudiants</a>
        </div>
        <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
    </nav>

    <header class="page-hero page-hero-blue">
        <div class="page-hero-inner">
            <span class="page-hero-icon">🕒</span>
            <div>
                <h1>Emploi du temps ADE</h1>
                <p>Consultez les séances jour par jour, filtrées par promotion et par groupe.</p>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="card">

            <!-- Filtres -->
            <div class="edt-filtres">
                <button id="btn-refresh-ade" class="btn btn-secondary">
                    <span class="btn-refresh-icon">🔄</span> Actualiser ADE
                </button>

                <div>
                    <label for="edt-filter-niveau">Niveau</label>
                    <select id="edt-filter-niveau" onchange="onNiveauChange()">
                        <option value="TOUS">Tous les niveaux</option>
                        <option value="BUT1">BUT1</option>
                        <option value="BUT2">BUT2</option>
                        <option value="BUT3">BUT3</option>
                    </select>
                </div>

                <div>
                    <label for="edt-filter-groupe">Groupe / TP</label>
                    <select id="edt-filter-groupe" onchange="applyEDTFilters()">
                        <option value="TOUS">Tous les groupes</option>
                    </select>
                </div>

                <span id="edt-status" class="status-text"></span>
            </div>

            <!-- Navigation jour par jour -->
            <div class="edt-nav">
                <button class="btn btn-secondary" onclick="changerJour(-1)" aria-label="Jour précédent" title="Jour précédent (←)">◀</button>
                <div class="edt-nav-center">
                    <strong id="current-date-display">--/--/----</strong>
                    <span id="edt-count"></span>
                </div>
                <button class="btn btn-secondary" onclick="changerJour(1)" aria-label="Jour suivant" title="Jour suivant (→)">▶</button>
            </div>

            <div class="edt-outils">
                <button class="btn-lien" onclick="allerAujourdhui()">Aujourd'hui</button>
                <label>Aller au :
                    <input type="date" id="edt-date-picker" onchange="allerAuJour(this.value)">
                </label>
                <label>
                    <input type="checkbox" id="edt-skip-empty"> Sauter les jours sans cours
                </label>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Horaires</th>
                        <th>Matière / Cours</th>
                        <th>Enseignant</th>
                        <th>Salle</th>
                        <th>Groupe(s) cible(s)</th>
                    </tr>
                </thead>
                <tbody id="seances-table">
                    <tr>
                        <td colspan="5" style="text-align: center;">Chargement de l'emploi du temps en cours...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
