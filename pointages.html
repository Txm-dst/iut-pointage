<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // On vérifie la connexion avant même d'afficher la page, pour éviter un flash de contenu
        if (sessionStorage.getItem('iutAuth') !== '1') { location.replace('index.html'); }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointages — IUT Pointage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Librairie pour parser le format iCal/ICS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="brand"><span class="brand-mark">IUT</span> IUT Pointage</div>
        <div class="nav-links">
            <a class="nav-link" href="edt.html">🕒 Emploi du temps</a>
            <a class="nav-link nav-amber-active" href="pointages.html">📋 Pointages</a>
            <a class="nav-link" href="recherche.html">🔍 Recherche</a>
            <a class="nav-link" href="gestion.html">👥 Gestion des étudiants</a>
        </div>
        <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
    </nav>

    <header class="page-hero page-hero-amber">
        <div class="page-hero-inner">
            <span class="page-hero-icon">📋</span>
            <div>
                <h1>Consultation des pointages</h1>
                <p>Filtrez par étudiant, groupe, enseignement, salle, enseignant, date et heure. Les filtres se combinent.</p>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="card">
            <div class="pt-haut">
                <div class="pt-recherche">
                    <span class="pt-loupe">🔍</span>
                    <input type="text" id="pt-texte" class="pt-champ" placeholder="Rechercher un étudiant (nom, prénom, n° étu, badge)" oninput="appliquerFiltresPointages()">
                </div>
                <div class="pt-raccourcis" role="group" aria-label="Période">
                    <button type="button" onclick="periodeRapide(0)">Aujourd'hui</button>
                    <button type="button" onclick="periodeRapide(7)">7 jours</button>
                    <button type="button" onclick="periodeRapide(30)">30 jours</button>
                </div>
            </div>

            <div class="pt-grille">
                <label class="pt-bloc"><span>Groupe</span>
                    <select id="pt-groupe" class="pt-champ" onchange="appliquerFiltresPointages()"></select></label>
                <label class="pt-bloc"><span>Enseignement</span>
                    <select id="pt-cours" class="pt-champ" onchange="appliquerFiltresPointages()"></select></label>
                <label class="pt-bloc"><span>Salle</span>
                    <select id="pt-salle" class="pt-champ" onchange="appliquerFiltresPointages()"></select></label>
                <label class="pt-bloc"><span>Enseignant</span>
                    <select id="pt-prof" class="pt-champ" onchange="appliquerFiltresPointages()"></select></label>
                <label class="pt-bloc"><span>Statut</span>
                    <select id="pt-statut" class="pt-champ" onchange="appliquerFiltresPointages()">
                        <option value="">Tous</option>
                        <option value="ok">À l'heure</option>
                        <option value="retard">En retard</option>
                        <option value="sans">Sans cours associé</option>
                    </select></label>
                <label class="pt-bloc"><span>Du</span>
                    <input type="date" id="pt-date-debut" class="pt-champ" onchange="rafraichirPointages()"></label>
                <label class="pt-bloc"><span>Au</span>
                    <input type="date" id="pt-date-fin" class="pt-champ" onchange="rafraichirPointages()"></label>
                <label class="pt-bloc"><span>De (heure)</span>
                    <input type="time" id="pt-heure-debut" class="pt-champ" onchange="appliquerFiltresPointages()"></label>
                <label class="pt-bloc"><span>À (heure)</span>
                    <input type="time" id="pt-heure-fin" class="pt-champ" onchange="appliquerFiltresPointages()"></label>
            </div>

            <div class="pt-barre">
                <strong id="pt-compteur"></strong>
                <span id="pt-status" class="status-text"></span>
                <span class="pt-espace"></span>
                <label class="pt-toggle"><input type="checkbox" id="pt-tous" onchange="appliquerFiltresPointages()"> Afficher tous les badgeages</label>
                <button class="btn btn-secondary" onclick="reinitialiserFiltresPointages()">Réinitialiser</button>
                <button class="btn btn-secondary" onclick="rafraichirPointages()">🔄 Actualiser</button>
            </div>
            <div class="pt-table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th><th>Heure</th><th>Étudiant</th><th>N° étu</th><th>Groupe</th>
                            <th>Enseignement</th><th>Salle</th><th>Enseignant</th><th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="pointages-table">
                        <tr><td colspan="9" style="text-align:center;">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
